name: Create a Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Build for GNU (gcc/glibc)
        run: |
          ./x build
          mkdir -p build && mv xsetwall build/xsetwall-x86_64-linux-gnu

      - name: Build for musl
        run: |
          ./x build-musl
          mv xsetwall-musl build/xsetwall-x86_64-linux-musl

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            build/xsetwall-x86_64-linux-gnu
            build/xsetwall-x86_64-linux-musl
          generate_release_notes: true