name: Create a Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Build for GNU (gcc/glibc)
        run: |
          mkdir -p build
          gcc -Wall -Wextra -O3 -o build/xsetwall-x86_64-linux-gnu xsetwall.c -lX11 -lm

      - name: Build for musl
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:latest sh -c '
            apk add --no-cache build-base libx11-dev
            gcc -Wall -Wextra -O3 -o build/xsetwall-x86_64-linux-musl xsetwall.c -lX11 -lm
          '

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            build/xsetwall-x86_64-linux-gnu
            build/xsetwall-x86_64-linux-musl
          generate_release_notes: true